<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- mouse body, seen from above -->
  <rect x="332" y="176" width="360" height="672" rx="180" fill="#ffffff" filter="url(#shadow)"/>
  <!-- one-finger glide trail -->
  <path d="M 420 700 C 430 560, 560 560, 580 400" fill="none" stroke="url(#trail)" stroke-width="44" stroke-linecap="round"/>
  <circle cx="584" cy="372" r="56" fill="#4f46e5"/>
  <circle cx="584" cy="372" r="22" fill="#ffffff" opacity="0.9"/>
</svg>
